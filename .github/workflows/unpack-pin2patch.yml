name: Unpack Pin2Patch source

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/unpack-pin2patch.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and unpack the source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .pin2patch-source/part-* > /tmp/pin2patch-source.tar.xz.b64
          base64 --decode /tmp/pin2patch-source.tar.xz.b64 > /tmp/pin2patch-source.tar.xz
          mkdir -p /tmp/pin2patch-unpack
          tar -xJf /tmp/pin2patch-source.tar.xz -C /tmp/pin2patch-unpack

          # Replace the temporary upload representation with the normal source tree.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/pin2patch-unpack/. .

      - name: Commit the complete Pin2Patch project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upload complete Pin2Patch MVP"
          git push
