name: Unpack Pin2Patch source

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  unpack:
    if: github.head_ref == 'agent/unpack-pin2patch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Reconstruct and unpack the source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .pin2patch-source/part-* > /tmp/pin2patch-source.tar.xz.b64
          base64 --decode /tmp/pin2patch-source.tar.xz.b64 > /tmp/pin2patch-source.tar.xz
          mkdir -p /tmp/pin2patch-unpack
          tar -xJf /tmp/pin2patch-source.tar.xz -C /tmp/pin2patch-unpack

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/pin2patch-unpack/. .

      - name: Commit the complete Pin2Patch project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upload complete Pin2Patch MVP"
          git push origin "HEAD:${{ github.head_ref }}"
